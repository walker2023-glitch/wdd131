<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Book - Flexbox Exercise</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="Apple Crisp Recipe">
    <meta property="og:description" content="A simple yet delicious fall dessert that's great served warm with vanilla ice cream.">
    <meta property="og:url" content="Your GitHub Pages URL">
    <meta property="og:image" content="images/social-preview-image.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Apple Crisp Recipe">
    <meta name="twitter:description" content="A simple yet delicious fall dessert.">
    <meta name="twitter:image" content="images/social-preview-image.png">

    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
                
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="main-header">
      <div class="logo-area">
        <img src="../../images/recipe-book.png" alt="Book logo" class="brand-icon">
        <h1>RECIPEBOOK</h1>
      </div>
    </header>

    <div class="search-container">
      <div class="search-box">
        <input type="text" placeholder="Find a recipe" />
        <img src="../../images/search.svg" alt="search logo" class="search-icon">
      </div>
    </div>

    <main>
      <article class="media-card">
        <div class="media-card-image">
          <img src="../../images/apple-crisp.jpg" alt="Apple Crisp"> 
          
        </div>
        
        <div class="media-card-content">
            <span class="tag">dessert</span>
          <h2>Apple Crisp</h2>
          
          <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star-empty">☆</span>
          </span>

          <p class="description">This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.</p>
        </div>
      </article>

      <div class="social">
        <a href="#"><img src="../../images/instagram_icon.svg" alt="instagram icon" class="social-icon"></a>
        <a href="#"><img src="../../images/youtube_icon.svg" alt="youtube icon" class="social-icon"></a>
        <a href="#"><img src="../../images/pinterest_icon.svg" alt="pinterest icon" class="social-icon"></a>
      </div>                  
    </main>

    <footer>
      <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>                    
    </footer>
  </body>
</html>
